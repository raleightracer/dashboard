<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Bright Minds School Management System — Login" />
  <title>Bright Minds — Sign In</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

<div class="login-page">
  <div class="login-card">

    <header class="login-logo">
      <div class="login-logo-icon" aria-hidden="true">
        <i class="ti ti-building-school"></i>
      </div>
      <div>
        <div class="login-logo-text">Bright Minds</div>
        <div class="login-logo-sub">School Management System</div>
      </div>
    </header>

    <h1 class="login-heading">Sign in to your account</h1>
    <p class="login-sub">Enter your credentials to access your dashboard.</p>

    <div
      id="login-error"
      class="login-error"
      role="alert"
      aria-live="assertive"
      hidden
    ></div>

    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input
        type="text"
        id="username"
        class="form-control"
        placeholder="Enter your username"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
      />
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input
        type="password"
        id="password"
        class="form-control"
        placeholder="Enter your password"
        autocomplete="current-password"
      />
    </div>

    <button class="login-btn" onclick="handleLogin()">Sign in</button>

  </div>
</div>

<!--
  Load order matters:
    1. mockData.js  — data layer (no dependencies)
    2. rbac.js      — routing table + redirectToRole() that auth.js calls
    3. auth.js      — credential logic, calls redirectToRole() from rbac.js
-->
<script src="assets/data/mockData.js"></script>
<script src="assets/js/rbac.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
