<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HR Staff — Bright Minds</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>

<script src="../assets/data/mockData.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/rbac.js"></script>
<script>
'use strict';

const session = guardPage();

if (session) {
  renderShell(session, 'HR Staff Management');

  let employees  = structuredClone(MOCK_DATA.employees);
  let searchTerm = '';

  const DEPT_COLORS = {
    Administration: '#6366f1', Enrollment: '#0ea5e9', Procurement: '#f59e0b',
    HR: '#22c55e', Daycare: '#ec4899', Facilities: '#8b5cf6',
  };

  function getInitials(name) {
    return name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
  }

  function avatarColor(dept) { return DEPT_COLORS[dept] ?? '#64748b'; }

  function setSearch(val) { searchTerm = val.toLowerCase(); render(); }

  function openEditModal(id) {
    const emp = employees.find(e => e.id === id);
    if (!emp) return;
    const depts    = Object.keys(DEPT_COLORS);
    const statuses = ['Active', 'On Leave', 'Inactive'];
    openModal(`Edit — ${emp.name}`, `
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="f-name">Full Name</label>
          <input class="form-control" id="f-name" value="${emp.name}" />
        </div>
        <div class="form-group">
          <label class="form-label" for="f-dept">Department</label>
          <select class="form-control" id="f-dept">
            ${depts.map(d => `<option${emp.department===d?' selected':''}>${d}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="f-role">Role / Position</label>
          <input class="form-control" id="f-role" value="${emp.role}" />
        </div>
        <div class="form-group">
          <label class="form-label" for="f-status">Status</label>
          <select class="form-control" id="f-status">
            ${statuses.map(s => `<option${emp.status===s?' selected':''}>${s}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="f-email">Email</label>
        <input class="form-control" id="f-email" value="${emp.email}" />
      </div>`, () => {
        emp.name       = document.getElementById('f-name').value.trim();
        emp.department = document.getElementById('f-dept').value;
        emp.role       = document.getElementById('f-role').value.trim();
        emp.status     = document.getElementById('f-status').value;
        emp.email      = document.getElementById('f-email').value.trim();
        render();
        showToast('Employee record updated.');
      });
  }

  function openAddModal() {
    const depts = Object.keys(DEPT_COLORS);
    openModal('Add New Employee', `
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="f-name">Full Name</label>
          <input class="form-control" id="f-name" placeholder="Full name" />
        </div>
        <div class="form-group">
          <label class="form-label" for="f-dept">Department</label>
          <select class="form-control" id="f-dept">
            ${depts.map(d => `<option>${d}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="f-role">Role / Position</label>
          <input class="form-control" id="f-role" placeholder="e.g. Lead Teacher" />
        </div>
        <div class="form-group">
          <label class="form-label" for="f-date">Start Date</label>
          <input class="form-control" id="f-date" type="date" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="f-email">Email</label>
        <input class="form-control" id="f-email" placeholder="name@brightminds.edu" />
      </div>`, () => {
        const name = document.getElementById('f-name').value.trim();
        const role = document.getElementById('f-role').value.trim();
        if (!name || !role) { showToast('Name and role are required.', 'danger'); return; }
        employees.push({
          id:         `emp${Date.now()}`,
          name,
          department: document.getElementById('f-dept').value,
          role,
          startDate:  document.getElementById('f-date').value,
          status:     'Active',
          email:      document.getElementById('f-email').value.trim(),
        });
        render();
        showToast('Employee added successfully.');
      });
  }

  function render() {
    const filtered = searchTerm
      ? employees.filter(e =>
          e.name.toLowerCase().includes(searchTerm) ||
          e.department.toLowerCase().includes(searchTerm) ||
          e.role.toLowerCase().includes(searchTerm))
      : employees;

    const active  = employees.filter(e => e.status === 'Active').length;
    const onLeave = employees.filter(e => e.status === 'On Leave').length;

    document.getElementById('main-content').innerHTML = `
      <div class="stat-grid" style="grid-template-columns:repeat(3,1fr)">
        <div class="stat-card accent"><div class="stat-label">Total Staff</div><div class="stat-value">${employees.length}</div></div>
        <div class="stat-card success"><div class="stat-label">Active</div><div class="stat-value">${active}</div></div>
        <div class="stat-card warning"><div class="stat-label">On Leave</div><div class="stat-value">${onLeave}</div></div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Employee Directory</span>
          <div style="display:flex;gap:8px;align-items:center">
            <input
              class="form-control"
              style="width:220px"
              placeholder="Search name, dept, role…"
              value="${searchTerm}"
              oninput="setSearch(this.value)"
              aria-label="Search employees"
            />
            <button class="btn btn-primary btn-sm" onclick="openAddModal()">
              <i class="ti ti-plus" aria-hidden="true"></i> Add Employee
            </button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Employee</th><th>Department</th><th>Role</th>
                <th>Email</th><th>Start Date</th><th>Status</th><th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${filtered.length === 0
                ? `<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:32px">No employees match your search.</td></tr>`
                : filtered.map(e => `
                  <tr>
                    <td>
                      <div style="display:flex;align-items:center;gap:10px">
                        <div aria-hidden="true" style="width:32px;height:32px;border-radius:50%;background:${avatarColor(e.department)};color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0">
                          ${getInitials(e.name)}
                        </div>
                        <strong>${e.name}</strong>
                      </div>
                    </td>
                    <td>${e.department}</td>
                    <td>${e.role}</td>
                    <td><a href="mailto:${e.email}" style="color:var(--accent)">${e.email}</a></td>
                    <td>${formatDate(e.startDate)}</td>
                    <td>${badge(e.status)}</td>
                    <td>
                      <button class="btn btn-sm btn-secondary" onclick="openEditModal('${e.id}')">
                        <i class="ti ti-edit" aria-hidden="true"></i> Edit
                      </button>
                    </td>
                  </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
  }

  document.addEventListener('DOMContentLoaded', render);
}
</script>
</body>
</html>
