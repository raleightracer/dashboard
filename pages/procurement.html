<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procurement — Bright Minds</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>

<script src="../assets/data/mockData.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/rbac.js"></script>
<script>
'use strict';

const session = guardPage();

if (session) {
  renderShell(session, 'Procurement Management');

  let requests     = structuredClone(MOCK_DATA.purchaseRequests);
  let activeFilter = 'All';

  function setStatus(id, status) {
    const req = requests.find(r => r.id === id);
    if (req) { req.status = status; render(); showToast(`Request ${status.toLowerCase()}.`); }
  }

  function deleteRequest(id) {
    openModal('Confirm Delete', '<p style="font-size:14px">Are you sure you want to delete this purchase request? This cannot be undone.</p>', () => {
      requests = requests.filter(r => r.id !== id);
      render();
      showToast('Request deleted.', 'danger');
    });
  }

  function setFilter(val) { activeFilter = val; render(); }

  function render() {
    const filtered   = activeFilter === 'All' ? requests : requests.filter(r => r.status === activeFilter);
    const totalValue = requests.reduce((acc, r) => acc + r.cost * r.qty, 0);
    const pending    = requests.filter(r => r.status === 'Pending').length;

    document.getElementById('main-content').innerHTML = `
      <div class="stat-grid" style="grid-template-columns:repeat(3,1fr)">
        <div class="stat-card accent"><div class="stat-label">Total Requests</div><div class="stat-value">${requests.length}</div></div>
        <div class="stat-card warning"><div class="stat-label">Pending</div><div class="stat-value">${pending}</div></div>
        <div class="stat-card success">
          <div class="stat-label">Total Value</div>
          <div class="stat-value" style="font-size:20px">${formatCurrency(totalValue)}</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Purchase Requests</span>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            ${['All','Pending','Approved','Rejected'].map(s =>
              `<button class="btn btn-sm ${activeFilter===s?'btn-primary':'btn-secondary'}"
                       onclick="setFilter('${s}')">${s}</button>`
            ).join('')}
            <button class="btn btn-primary btn-sm" onclick="openAddModal()">
              <i class="ti ti-plus" aria-hidden="true"></i> New Request
            </button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Item</th><th>Category</th><th>Qty</th><th>Unit Cost</th>
                <th>Total</th><th>Requested By</th><th>Date</th><th>Status</th><th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${filtered.length === 0
                ? `<tr><td colspan="9" style="text-align:center;color:var(--text-muted);padding:32px">No requests found.</td></tr>`
                : filtered.map(r => `
                  <tr>
                    <td><strong>${r.item}</strong></td>
                    <td><span class="badge badge-info">${r.category}</span></td>
                    <td>${r.qty}</td>
                    <td>${formatCurrency(r.cost)}</td>
                    <td><strong>${formatCurrency(r.cost * r.qty)}</strong></td>
                    <td>${r.requestedBy}</td>
                    <td>${formatDate(r.date)}</td>
                    <td>${badge(r.status)}</td>
                    <td>
                      <div class="action-btns">
                        ${r.status === 'Pending' ? `
                          <button class="btn btn-sm btn-success" onclick="setStatus('${r.id}','Approved')" title="Approve">
                            <i class="ti ti-check" aria-hidden="true"></i>
                          </button>
                          <button class="btn btn-sm btn-danger" onclick="setStatus('${r.id}','Rejected')" title="Reject">
                            <i class="ti ti-x" aria-hidden="true"></i>
                          </button>` : ''}
                        <button class="btn btn-sm btn-secondary" onclick="deleteRequest('${r.id}')" title="Delete">
                          <i class="ti ti-trash" aria-hidden="true"></i>
                        </button>
                      </div>
                    </td>
                  </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
  }

  function openAddModal() {
    const categories = ['Classroom','Furniture','Supplies','Sanitation','Technology','Other'];
    openModal('New Purchase Request', `
      <div class="form-group">
        <label class="form-label" for="f-item">Item Name</label>
        <input class="form-control" id="f-item" placeholder="e.g. Whiteboard Markers" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="f-cat">Category</label>
          <select class="form-control" id="f-cat">
            ${categories.map(c => `<option>${c}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="f-qty">Quantity</label>
          <input class="form-control" id="f-qty" type="number" min="1" placeholder="1" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="f-cost">Unit Cost (₱)</label>
          <input class="form-control" id="f-cost" type="number" min="0" step="0.01" placeholder="0.00" />
        </div>
        <div class="form-group">
          <label class="form-label" for="f-by">Requested By</label>
          <input class="form-control" id="f-by" value="${session.name}" />
        </div>
      </div>`, () => {
        const item = document.getElementById('f-item').value.trim();
        const qty  = parseInt(document.getElementById('f-qty').value);
        const cost = parseFloat(document.getElementById('f-cost').value);
        const by   = document.getElementById('f-by').value.trim();
        const cat  = document.getElementById('f-cat').value;
        if (!item || !qty || isNaN(cost)) {
          showToast('Item, quantity, and cost are required.', 'danger');
          return;
        }
        requests.unshift({
          id: `p${Date.now()}`, item, category: cat, qty, cost,
          requestedBy: by, status: 'Pending',
          date: new Date().toISOString().split('T')[0],
        });
        render();
        showToast('Purchase request submitted.');
      });
  }

  document.addEventListener('DOMContentLoaded', render);
}
</script>
</body>
</html>
