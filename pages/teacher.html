<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Dashboard — Bright Minds</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <style>
    /* ── Teacher-specific component styles ───────────────────────────── */
    .teacher-hero {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border-radius: 16px;
      padding: 24px 28px;
      color: #fff;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .teacher-hero-avatar {
      width: 60px; height: 60px; border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 700; flex-shrink: 0;
    }
    .teacher-hero-name  { font-size: 20px; font-weight: 700; }
    .teacher-hero-sub   { font-size: 13px; opacity: 0.8; margin-top: 2px; }
    .teacher-hero-tag   {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.15); border-radius: 99px;
      padding: 4px 12px; font-size: 12px; font-weight: 600; margin-top: 8px;
    }
    .curriculum-chip {
      display: inline-block; padding: 2px 8px;
      border-radius: 99px; font-size: 10px; font-weight: 600;
    }
    .chip-Cognitive { background:#eef2ff; color:#4338ca; }
    .chip-Language  { background:#f0fdf4; color:#166534; }
    .chip-Creative  { background:#fdf4ff; color:#7e22ce; }
    .chip-Physical  { background:#fff7ed; color:#c2410c; }
    .chip-Social    { background:#eff6ff; color:#1d4ed8; }
    .chip-Science   { background:#f0fdfa; color:#0f766e; }
    .cert-expired   { background: #fef9f9 !important; }
    .expiry-warn    { color:#f59e0b; font-size:11px; font-weight:600; margin-left:8px; }
    .expiry-expired { color:#ef4444; font-size:11px; font-weight:600; margin-left:8px; }
    .alert-banner {
      display: flex; align-items: center; gap: 10px;
      background: #fffbeb; border: 1px solid #fde68a;
      border-radius: 10px; padding: 12px 16px; margin-bottom: 20px;
    }
    .alert-banner p { font-size: 13px; color: #92400e; }
  </style>
</head>
<body>

<script src="../assets/data/mockData.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/rbac.js"></script>
<script>
'use strict';

const session = guardPage();

if (session) {
  renderShell(session, 'Teacher Dashboard');

  document.addEventListener('DOMContentLoaded', () => {
    // Resolve teacher data by session id — same key used in MOCK_DATA.teachers.
    const td = MOCK_DATA.teachers[session.id];

    if (!td) {
      document.getElementById('main-content').innerHTML =
        `<p style="color:var(--text-secondary);padding:32px">No classroom data found for this account.</p>`;
      return;
    }

    /**
     * Returns how many days remain until a date string.
     * Negative = already expired.
     */
    function daysUntil(dateStr) {
      return Math.ceil((new Date(dateStr + 'T00:00:00') - new Date()) / 86_400_000);
    }

    function expiryNote(cert) {
      if (cert.status === 'Expired')  return `<span class="expiry-expired"><i class="ti ti-alert-triangle" aria-hidden="true"></i> Expired</span>`;
      const d = daysUntil(cert.expiry);
      if (d <= 90) return `<span class="expiry-warn"><i class="ti ti-bell" aria-hidden="true"></i> Expires in ${d} day${d !== 1 ? 's' : ''}</span>`;
      return '';
    }

    const expiredCount  = td.certifications.filter(c => c.status === 'Expired').length;
    const expiringCount = td.certifications.filter(c => c.status !== 'Expired' && daysUntil(c.expiry) <= 90).length;

    document.getElementById('main-content').innerHTML = `

      <!-- Hero banner -->
      <div class="teacher-hero" role="banner">
        <div class="teacher-hero-avatar" aria-hidden="true">${session.avatar}</div>
        <div>
          <div class="teacher-hero-name">${td.fullName}</div>
          <div class="teacher-hero-sub">${td.gradeLevel}</div>
          <div class="teacher-hero-tag"><i class="ti ti-door" aria-hidden="true"></i> ${td.classroom}</div>
        </div>
        <div style="margin-left:auto;text-align:right">
          <div style="font-size:28px;font-weight:700">${td.students.length}</div>
          <div style="font-size:12px;opacity:0.8">Students enrolled</div>
        </div>
      </div>

      <!-- Certification alert (conditionally rendered) -->
      ${expiredCount > 0 || expiringCount > 0 ? `
        <div class="alert-banner" role="alert">
          <i class="ti ti-alert-triangle" style="color:#f59e0b;font-size:18px;flex-shrink:0" aria-hidden="true"></i>
          <p>
            ${expiredCount  > 0 ? `<strong>${expiredCount} certification(s) have expired</strong> and require immediate renewal. ` : ''}
            ${expiringCount > 0 ? `<strong>${expiringCount} certification(s) expire within 90 days.</strong>` : ''}
          </p>
        </div>` : ''}

      <!-- Student Roster -->
      <section id="section-students" class="section" aria-labelledby="heading-students">
        <div class="section-title">
          <i class="ti ti-users-group" aria-hidden="true"></i>
          <h2 id="heading-students" style="font:inherit">My Students — ${td.classroom}</h2>
        </div>
        <div class="card">
          <div class="card-header">
            <span class="card-title">Student Roster</span>
            <span style="font-size:12px;color:var(--text-muted)">${td.students.length} student${td.students.length !== 1 ? 's' : ''}</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>#</th><th>Name</th><th>Age</th><th>Parent / Guardian</th><th>Contact</th><th>Notes</th></tr>
              </thead>
              <tbody>
                ${td.students.map((s, i) => `
                  <tr>
                    <td style="color:var(--text-muted)">${i + 1}</td>
                    <td><strong>${s.name}</strong></td>
                    <td>${s.age} yrs</td>
                    <td>${s.parentName}</td>
                    <td><a href="tel:${s.parentContact}" style="color:var(--accent)">${s.parentContact}</a></td>
                    <td>
                      ${s.notes
                        ? `<span style="font-size:12px;color:var(--text-secondary)"><i class="ti ti-info-circle" aria-hidden="true"></i> ${s.notes}</span>`
                        : `<span style="color:var(--text-muted)">—</span>`}
                    </td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- Weekly Curriculum -->
      <section id="section-curriculum" class="section" aria-labelledby="heading-curriculum">
        <div class="section-title">
          <i class="ti ti-calendar" aria-hidden="true"></i>
          <h2 id="heading-curriculum" style="font:inherit">Weekly Curriculum</h2>
        </div>
        <div class="card">
          <div class="card-header"><span class="card-title">This Week's Learning Plan</span></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Day</th><th>Time</th><th>Activity</th><th>Learning Objective</th><th>Type</th></tr>
              </thead>
              <tbody>
                ${td.curriculum.map(c => `
                  <tr>
                    <td><strong>${c.day}</strong></td>
                    <td style="color:var(--text-secondary)">${c.time}</td>
                    <td>${c.activity}</td>
                    <td style="color:var(--text-secondary)">${c.objective}</td>
                    <td><span class="curriculum-chip chip-${c.type}">${c.type}</span></td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- Certifications -->
      <section id="section-certs" class="section" aria-labelledby="heading-certs">
        <div class="section-title">
          <i class="ti ti-certificate" aria-hidden="true"></i>
          <h2 id="heading-certs" style="font:inherit">My Certifications</h2>
        </div>
        <div class="card">
          <div class="card-header">
            <span class="card-title">Professional Certifications</span>
            <span style="font-size:12px;color:var(--text-muted)">
              ${td.certifications.length} total &bull;
              ${td.certifications.filter(c => c.status === 'Valid').length} valid
            </span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Certification</th><th>Issuing Body</th><th>Issued</th><th>Expiry</th><th>Status</th></tr>
              </thead>
              <tbody>
                ${td.certifications.map(c => `
                  <tr class="${c.status === 'Expired' ? 'cert-expired' : ''}">
                    <td><strong>${c.name}</strong></td>
                    <td>${c.issuer}</td>
                    <td>${formatDate(c.issued)}</td>
                    <td>${formatDate(c.expiry)}${expiryNote(c)}</td>
                    <td>${badge(c.status)}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      </section>`;
  });
}
</script>
</body>
</html>
