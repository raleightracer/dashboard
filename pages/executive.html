<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Executive Summary — Bright Minds</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>

<script src="../assets/data/mockData.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/rbac.js"></script>
<script>
'use strict';

const session = guardPage();

if (session) {
  renderShell(session, 'Executive Summary');

  document.addEventListener('DOMContentLoaded', () => {
    const s        = MOCK_DATA.executiveSummary;
    const areas = getEnrollmentAreas();
    const allStudents = areas.flatMap(area =>
      area.students.map(st => ({ ...st, areaName: area.name, areaId: area.id }))
    );
    const approved = allStudents.filter(su => su.enrollmentStatus === 'Approved').length;
    const pending  = allStudents.filter(su => su.enrollmentStatus === 'Pending').length;
    const openProc = MOCK_DATA.purchaseRequests.filter(p => p.status === 'Pending').length;
    const budgetPct = Math.round((s.monthlyBudgetUsed / s.monthlyBudgetTotal) * 100);
    const budgetBarColor = budgetPct > 80 ? '#ef4444' : budgetPct > 60 ? '#f59e0b' : '#6366f1';
    const recentStudents = allStudents
      .slice()
      .sort((a, b) => (b.firstDayOfSchool || '').localeCompare(a.firstDayOfSchool || ''))
      .slice(0, 8);

    document.getElementById('main-content').innerHTML = `
      <div class="stat-grid">
        <div class="stat-card accent">
          <div class="stat-icon" style="color:#6366f1"><i class="ti ti-users-group" aria-hidden="true"></i></div>
          <div class="stat-label">Total Enrolled</div>
          <div class="stat-value">${approved}</div>
          <div class="stat-sub">Active daycare students</div>
        </div>
        <div class="stat-card warning">
          <div class="stat-icon" style="color:#f59e0b"><i class="ti ti-clock" aria-hidden="true"></i></div>
          <div class="stat-label">Pending Applications</div>
          <div class="stat-value">${pending}</div>
          <div class="stat-sub">Awaiting review</div>
        </div>
        <div class="stat-card success">
          <div class="stat-icon" style="color:#22c55e"><i class="ti ti-users" aria-hidden="true"></i></div>
          <div class="stat-label">Total Employees</div>
          <div class="stat-value">${s.totalEmployees}</div>
          <div class="stat-sub">Across all departments</div>
        </div>
        <div class="stat-card danger">
          <div class="stat-icon" style="color:#ef4444"><i class="ti ti-shopping-cart" aria-hidden="true"></i></div>
          <div class="stat-label">Open Purchase Requests</div>
          <div class="stat-value">${openProc}</div>
          <div class="stat-sub">Pending procurement</div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px">
        <div class="card">
          <div class="card-header"><span class="card-title">Monthly Budget</span></div>
          <div class="card-body">
            <div class="budget-labels">
              <span>Used: <strong>${formatCurrency(s.monthlyBudgetUsed)}</strong></span>
              <span>Total: <strong>${formatCurrency(s.monthlyBudgetTotal)}</strong></span>
            </div>
            <div class="progress-wrap" role="progressbar" aria-valuenow="${budgetPct}" aria-valuemin="0" aria-valuemax="100">
              <div class="progress-bar" style="width:${budgetPct}%;background:${budgetBarColor}"></div>
            </div>
            <p style="font-size:12px;color:var(--text-secondary);margin-top:8px">${budgetPct}% of monthly budget consumed</p>
          </div>
        </div>
        <div class="card">
          <div class="card-header"><span class="card-title">Department Headcount</span></div>
          <div class="card-body">
            ${s.departmentHeadcount.map(d => `
              <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)">
                <span style="font-size:13px">${d.dept}</span>
                <strong style="color:var(--accent)">${d.count}</strong>
              </div>`).join('')}
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Recent Enrollment Applications</span>
          <a href="enrollment.html?area=area1" class="btn btn-secondary btn-sm">
            <i class="ti ti-arrow-right" aria-hidden="true"></i> View All
          </a>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Student</th><th>Area</th><th>Class</th>
                <th>Parent / Guardian</th><th>First Day</th><th>Status</th>
              </tr>
            </thead>
            <tbody>
              ${recentStudents.map(e => `
                <tr>
                  <td><strong>${e.firstName} ${e.lastName}</strong></td>
                  <td>${e.areaName}</td>
                  <td>${e.classroomId?.includes('infant') ? 'Infant' : 'Toddler'}</td>
                  <td>${e.guardian?.fullName || '—'}</td>
                  <td>${formatDate(e.firstDayOfSchool)}</td>
                  <td>${badge(e.enrollmentStatus)}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
  });
}
</script>
</body>
</html>
